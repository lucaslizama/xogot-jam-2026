name: Publish web build to itch.io

# Never on an ordinary push. Publishing moves the version the team is testing
# against, so it takes a deliberate act: either pressing the button, or tagging
# a release.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "itch.io channel to push to"
        required: false
        default: "html5"
  push:
    tags:
      # Plain version numbers, no leading v. Glob rather than a pattern, since
      # that is all tag filters understand: this matches 0.7.0 and 1.10.2 alike.
      - "[0-9]*.[0-9]*.[0-9]*"

env:
  GODOT_VERSION: 4.6.1-stable
  ITCH_TARGET: lucaslizama/pizza-flicker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The templates are well over a gigabyte, so they are cached on the engine
      # version. A cold run takes a few minutes; a warm one takes seconds.
      - name: Cache Godot and its export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -sSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -sSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -tq /tmp/templates.tpz > /dev/null
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          target=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$(dirname "$target")"
          rm -rf "$target"
          mv /tmp/tpl/templates "$target"

      - name: Work out the version and stamp it into the project
        run: |
          set -euo pipefail
          # A tagged run is its tag. Anything else is named after the run that
          # made it, so a trial build can never be mistaken for a release.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="0.0.0-ci.${{ github.run_number }}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

          recorded="$(sed -n 's|^config/version="\(.*\)"$|\1|p' project.godot)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${recorded}" != "${version}" ]; then
            echo "::warning::the project records ${recorded:-nothing} but the tag is ${version}; the build will carry the tag"
          fi

          # Stamped into the checkout only, never committed. The build therefore
          # always agrees with the tag it was made from, even if someone tagged
          # without bumping.
          if grep -q '^config/version=' project.godot; then
            sed -i "s|^config/version=.*|config/version=\"${version}\"|" project.godot
          else
            sed -i "s|^config/name=|config/version=\"${version}\"\nconfig/name=|" project.godot
          fi
          grep '^config/version=' project.godot

      - name: Run the test suites
        run: |
          set -euo pipefail
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --import || true
          failed=0
          for suite in test_throw test_street test_game; do
            output="$(godot --headless "res://tests/${suite}.tscn" 2>&1 | sed 's/\x1b\[[0-9;]*m//g')"
            summary="$(echo "$output" | grep -E '^=== ' || echo 'no summary')"
            echo "${suite}: ${summary}"
            echo "$output" | grep -E '^  FAIL' || true
            echo "$summary" | grep -qE '0 failed' || failed=1
          done
          exit $failed

      - name: Export the web build
        run: |
          set -euo pipefail
          export PATH="$HOME/godot-bin:$PATH"
          mkdir -p build/web
          godot --headless --export-debug "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Install butler
        run: |
          set -euo pipefail
          # broth serves a zip holding butler plus the two libraries it needs
          # alongside it, so the whole archive is extracted, not just the binary.
          curl -sSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d ~/butler-bin
          chmod +x ~/butler-bin/butler
          ~/butler-bin/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "BUTLER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # A tag push carries no inputs, so the channel falls back to the default.
          channel="${{ inputs.channel }}"
          channel="${channel:-html5}"

          echo "publishing to ${ITCH_TARGET}:${channel} as ${VERSION}"
          ~/butler-bin/butler push build/web "${ITCH_TARGET}:${channel}" --userversion "${VERSION}"
          ~/butler-bin/butler status "${ITCH_TARGET}:${channel}"
